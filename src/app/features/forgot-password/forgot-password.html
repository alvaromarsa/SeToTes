<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-card__header">
      <p class="auth-card__eyebrow">Recuperar acceso</p>
      <h1>¿Has olvidado tu contraseña?</h1>
    </div>

    @if (isSent) {
      <p class="form-success" role="status">{{ successMessage }}</p>
      <p class="auth-card__text">
        <a routerLink="/login">Volver a iniciar sesión</a>
      </p>
    } @else {
      <p class="auth-card__text">
        Escribe el email de tu cuenta y te enviaremos un enlace para elegir una contraseña nueva.
      </p>

      <form class="auth-form" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <label class="field">
          <span>Email</span>
          <input type="email" formControlName="email" placeholder="tu@email.com" autocomplete="email" />
          @if (formUtils.isValidField(forgotForm, 'email')) {
            <small>{{ formUtils.getFieldError(forgotForm, 'email') }}</small>
          }
        </label>

        @if (formMessage) {
          <p class="form-alert" role="alert">{{ formMessage }}</p>
        }

        <button #submitButton type="submit" class="primary-button" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Enviando…' : 'Enviar enlace' }}
        </button>

        <p class="auth-switch">
          ¿Te has acordado?
          <a routerLink="/login">Inicia sesión</a>
        </p>
      </form>
    }
  </div>
</section>
