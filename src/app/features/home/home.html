<!-- div y no main: app.html ya envuelve cada página en <main> -->
<div class="home-page">
  <section class="hero" aria-labelledby="home-title">
    <span class="hero__eyebrow">Hecho a mano</span>
    <h1 id="home-title">Accesorios hechos para moverse con estilo.</h1>
    <p>
      Bolsas, neceseres, fundas y telas hechos a mano, pensados para combinar funcionalidad,
      diseño y un acabado único.
    </p>
    <div class="hero__actions">
      <a routerLink="/bolsas" class="hero__btn hero__btn--primary">Ver bolsas</a>
      <a routerLink="/telas" class="hero__btn hero__btn--secondary">Explorar telas</a>
    </div>
  </section>

  <!-- Sin ningún producto visible (o si falla la carga), la sección no aparece -->
  @if (newArrivals().length > 0) {
    <app-new-arrivals [items]="newArrivals()" />
  }

  <app-trust-strip />
</div>
