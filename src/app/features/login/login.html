<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-card__header">
      <p class="auth-card__eyebrow">Bienvenid@ de nuevo</p>
      <h1>Inicia sesión</h1>
    </div>

    @if (infoMessage) {
      <p class="form-info" role="status">{{ infoMessage }}</p>
    }

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="tu@email.com" />
        @if (formUtils.isValidField(loginForm, 'email')) {
          <small>{{ formUtils.getFieldError(loginForm, 'email') }}</small>
        }
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input type="password" formControlName="password" placeholder="••••••••" />
        @if (formUtils.isValidField(loginForm, 'password')) {
          <small>{{ formUtils.getFieldError(loginForm, 'password') }}</small>
        }
      </label>

      <label class="checkbox-row">
        <input type="checkbox" formControlName="remember" />
        <span>Recordarme</span>
      </label>

      @if (formMessage) {
        <p class="form-alert" role="alert">{{ formMessage }}</p>
      }

      <button
        #submitButton
        type="submit"
        class="primary-button"
        [disabled]="isSubmitting || (loginForm.invalid && submitted)"
      >
        {{ isSubmitting ? 'Entrando…' : 'Entrar' }}
      </button>

      <p class="auth-switch">
        ¿No tienes cuenta?
        <a routerLink="/register">Regístrate aquí</a>
      </p>
    </form>
  </div>
</section>
