<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-card__header">
      <p class="auth-card__eyebrow">Únete a SeToTes</p>
      <h1>Crea tu cuenta</h1>
    </div>

    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="field-row">
        <label class="field">
          <span>Nombre completo</span>
          <input type="text" formControlName="fullName" placeholder="Tu nombre" />
          @if (formUtils.isValidField(registerForm, 'fullName')) {
            <small>{{ formUtils.getFieldError(registerForm, 'fullName') }}</small>
          }
        </label>

        <label class="field">
          <span>Teléfono</span>
          <input type="tel" formControlName="phone" placeholder="600 123 456" />
          @if (formUtils.isValidField(registerForm, 'phone')) {
            <small>{{ formUtils.getFieldError(registerForm, 'phone') }}</small>
          }
        </label>
      </div>

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="tu@email.com" />
        @if (formUtils.isValidField(registerForm, 'email')) {
          <small>{{ formUtils.getFieldError(registerForm, 'email') }}</small>
        }
      </label>

      <div class="field-row">
        <label class="field">
          <span>Contraseña</span>
          <input type="password" formControlName="password" placeholder="••••••••" />
          @if (formUtils.isValidField(registerForm, 'password')) {
            <small>{{ formUtils.getFieldError(registerForm, 'password') }}</small>
          }
        </label>

        <label class="field">
          <span>Repetir contraseña</span>
          <input type="password" formControlName="confirmPassword" placeholder="••••••••" />
          @if (formUtils.isValidField(registerForm, 'confirmPassword')) {
            <small>{{ formUtils.getFieldError(registerForm, 'confirmPassword') }}</small>
          }
        </label>
      </div>

      @if (formUtils.isFormError(registerForm, 'passwordMismatch')) {
        <p class="form-error">{{ formUtils.getFormError(registerForm, 'passwordMismatch') }}</p>
      }

      @if (formMessage) {
        <p class="form-alert" role="alert">{{ formMessage }}</p>
      }

      <button #submitButton type="submit" class="primary-button" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creando cuenta…' : 'Registrarme' }}
      </button>
    </form>
  </div>
</section>
