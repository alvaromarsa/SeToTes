<dialog
  #dialog
  class="confirm-dialog"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="messageId"
  (close)="onClose()"
>
  <h2 class="confirm-dialog__title" [id]="titleId">{{ title() }}</h2>
  <p class="confirm-dialog__message" [id]="messageId">{{ message() }}</p>

  <!-- method="dialog": cada botón cierra el diálogo y deja su value en returnValue -->
  <form class="confirm-dialog__actions" method="dialog">
    <!-- El foco empieza en Cancelar: la opción segura -->
    <button class="confirm-dialog__button" type="submit" value="cancel" autofocus>Cancelar</button>
    <button
      class="confirm-dialog__button confirm-dialog__button--confirm"
      [class.confirm-dialog__button--danger]="danger()"
      type="submit"
      value="confirm"
    >
      {{ confirmLabel() }}
    </button>
  </form>
</dialog>
